<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OVERRIDE // BREACH PROTOCOL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<style>
:root{
  --bg:#000000;
  --panel:#040f09;
  --panel2:#06170d;
  --line:#0e3a22;
  --green:#00ff6a;
  --green-dim:#0a5c34;
  --white-role:#38b6ff;
  --red-role:#ff3b5c;
  --amber:#ffcc45;
  --text:#c9ffe2;
  --dim:#3f8062;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);}
body{font-family:'Consolas','Courier New',monospace;color:var(--text);overflow-x:hidden;min-height:100vh;position:relative;}
canvas#rain{position:fixed;inset:0;z-index:0;opacity:.3;pointer-events:none;}
#crt{pointer-events:none;position:fixed;inset:0;z-index:999;background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 2px, transparent 3px);mix-blend-mode:overlay;}
#vignette{pointer-events:none;position:fixed;inset:0;z-index:998;box-shadow:inset 0 0 220px 60px rgba(0,0,0,0.88);}
#app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:16px 16px 60px;min-height:100vh;}
::selection{background:var(--green);color:#001208;}
a{color:var(--green);}

#toastbox{position:fixed;top:14px;right:14px;z-index:1200;display:flex;flex-direction:column;gap:8px;max-width:300px;}
.toast{background:#03110a;border:1px solid var(--amber);border-left:4px solid var(--amber);padding:10px 12px;border-radius:3px;font-size:12px;animation:toastIn .4s ease, toastOut .4s ease 3.6s forwards;box-shadow:0 4px 18px rgba(0,0,0,.6);}
.toast.deny{border-color:var(--red-role);}
.toast b{color:var(--amber);display:block;font-size:11px;letter-spacing:1px;margin-bottom:2px;text-transform:uppercase;}
.toast.deny b{color:var(--red-role);}
@keyframes toastIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px);}}

.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand svg{filter:drop-shadow(0 0 9px rgba(0,255,106,0.55));}
.brand-text h1{margin:0;font-size:21px;letter-spacing:4px;color:#eafff2;text-shadow:0 0 10px rgba(0,255,106,.6);}
.brand-text .tag{font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;}
.hud-right{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.stat{font-size:11px;color:var(--dim);text-align:right;letter-spacing:1px;}
.stat b{display:block;color:var(--text);font-size:13px;letter-spacing:1px;}
.rankpill{border:1px solid var(--green-dim);color:var(--green);padding:5px 10px;border-radius:3px;font-size:11px;letter-spacing:1px;background:rgba(0,255,106,0.07);white-space:nowrap;}
.iconbtn{border:1px solid var(--line);background:transparent;color:var(--dim);font-size:11px;padding:6px 10px;border-radius:3px;cursor:pointer;letter-spacing:1px;}
.iconbtn:hover{color:var(--green);border-color:var(--green-dim);}

@keyframes glitch{
  0%,92%,100%{transform:translate(0,0);text-shadow:0 0 10px rgba(0,255,106,.6);}
  93%{transform:translate(-1px,1px);text-shadow:2px 0 var(--red-role), -2px 0 var(--green);}
  95%{transform:translate(1px,-1px);text-shadow:-2px 0 var(--red-role), 2px 0 var(--green);}
  97%{transform:translate(0,0);text-shadow:0 0 10px rgba(0,255,106,.6);}
}
.brand-text h1{animation:glitch 6s infinite;}

.meter-wrap{margin-bottom:20px;}
.meter-label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:1px;color:var(--dim);margin-bottom:5px;text-transform:uppercase;}
.meter-label span.val{color:var(--text);font-weight:bold;}
.meter{position:relative;height:16px;border:1px solid var(--line);border-radius:2px;background:#020a05;overflow:hidden;}
.meter-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--amber) 60%,var(--red-role) 92%);transition:width .5s ease;}
.meter-threshold{position:absolute;top:0;bottom:0;left:75%;width:2px;background:var(--red-role);box-shadow:0 0 6px var(--red-role);}
.meter.alarm{animation:alarmPulse 1s infinite;}
@keyframes alarmPulse{0%,100%{box-shadow:0 0 0px rgba(255,59,92,0);}50%{box-shadow:0 0 18px 2px rgba(255,59,92,0.85);}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:16px;animation:fadeIn .45s ease;position:relative;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.panel h2{margin:0 0 10px;font-size:14px;letter-spacing:2px;color:var(--green);text-transform:uppercase;border-left:3px solid var(--green);padding-left:8px;}
.panel p{font-size:13px;line-height:1.6;color:var(--text);}
.muted{color:var(--dim);}

.btn{font-family:inherit;font-size:12px;letter-spacing:1px;text-transform:uppercase;background:transparent;color:var(--green);border:1px solid var(--green-dim);padding:11px 14px;border-radius:3px;cursor:pointer;transition:.15s;margin:4px 6px 4px 0;position:relative;overflow:hidden;}
.btn:hover:not(:disabled){background:rgba(0,255,106,0.12);border-color:var(--green);box-shadow:0 0 14px rgba(0,255,106,.25);}
.btn:disabled{opacity:.3;cursor:not-allowed;}
.btn.primary{background:var(--green);color:#001208;font-weight:bold;border-color:var(--green);}
.btn.primary:hover:not(:disabled){background:#6dffb0;}
.btn.danger{border-color:#7a2530;color:var(--red-role);}
.btn.danger:hover:not(:disabled){background:rgba(255,59,92,0.12);}
.btn.ghost{border-color:var(--line);color:var(--dim);}

.roles{display:flex;gap:14px;flex-wrap:wrap;}
.role-card{flex:1;min-width:240px;border:1px solid var(--line);background:var(--panel2);border-radius:4px;padding:16px;cursor:pointer;transition:.2s;}
.role-card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.5);}
.role-card.white{border-color:#134b63;}
.role-card.white:hover{border-color:var(--white-role);box-shadow:0 8px 22px rgba(56,182,255,.2);}
.role-card.red{border-color:#5c1c28;}
.role-card.red:hover{border-color:var(--red-role);box-shadow:0 8px 22px rgba(255,59,92,.2);}
.role-card h3{margin:0 0 6px;letter-spacing:1px;font-size:15px;}
.role-card.white h3{color:var(--white-role);}
.role-card.red h3{color:var(--red-role);}
.role-card ul{margin:10px 0 0;padding-left:16px;font-size:12px;color:var(--dim);line-height:1.7;}
.role-card ul li b{color:var(--text);}

/* ---- CAMPAIGN MAP ---- */
.tier-block{margin-bottom:22px;}
.tier-head{font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:8px;border-bottom:1px dashed var(--line);padding-bottom:6px;}
.tier-head b{color:var(--green);}
.maprow{display:flex;gap:12px;flex-wrap:wrap;}
.mapnode{width:150px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:12px 10px;text-align:center;cursor:pointer;transition:.15s;position:relative;overflow:hidden;}
.mapnode:hover{transform:translateY(-2px);}
.mapnode .icon{font-size:28px;display:block;margin-bottom:6px;}
.mapnode .mname{font-size:11px;color:var(--text);display:block;line-height:1.3;min-height:28px;}
.mapnode .mthreat{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-top:6px;display:block;}
.mapnode.current{border-color:var(--green);box-shadow:0 0 16px rgba(0,255,106,.35);animation:beacon 2s infinite;}
@keyframes beacon{0%,100%{box-shadow:0 0 10px rgba(0,255,106,.25);}50%{box-shadow:0 0 22px rgba(0,255,106,.55);}}
.mapnode.done{border-color:var(--green-dim);}
.mapnode.done .mthreat{color:var(--green);}
.mapnode.done::after{content:"✓";position:absolute;top:6px;right:8px;color:var(--green);font-size:13px;}
.mapnode.locked{opacity:.4;}
.mapnode.locked::after{content:"🔒";position:absolute;top:6px;right:8px;font-size:12px;}
.mapnode.boss{border-color:var(--red-role);}
.mapnode.boss.current{box-shadow:0 0 18px rgba(255,59,92,.5);animation:beaconred 1.6s infinite;}
@keyframes beaconred{0%,100%{box-shadow:0 0 10px rgba(255,59,92,.3);}50%{box-shadow:0 0 24px rgba(255,59,92,.65);}}

/* ---- MAP LOCATION DETAIL / REPORT ---- */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0;}
.stats-grid div{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px;}
.stats-grid .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;}
.stats-grid .v{font-size:16px;color:var(--text);margin-top:3px;}

/* ---- MISSION NODE MAP (in-mission) ---- */
.nodemap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.node-chip{flex:1;min-width:120px;text-align:center;border:1px solid var(--line);border-radius:4px;padding:10px 6px;font-size:11px;letter-spacing:.5px;background:var(--panel2);position:relative;overflow:hidden;}
.node-chip .n-name{display:block;font-size:12px;margin-bottom:4px;color:var(--text);}
.node-chip .n-status{font-size:10px;text-transform:uppercase;letter-spacing:1px;}
.node-chip.locked{opacity:.4;}
.node-chip.locked .n-status{color:var(--dim);}
.node-chip.active{border-color:var(--green);box-shadow:0 0 10px rgba(0,255,106,.35);}
.node-chip.active .n-status{color:var(--green);}
.node-chip.done{border-color:var(--green);}
.node-chip.done .n-status{color:var(--green);}
.node-arrow{color:var(--dim);font-size:16px;}
.target-lock::before,.target-lock::after{content:"";position:absolute;width:14px;height:14px;border-color:var(--green);border-style:solid;z-index:2;}
.target-lock::before{top:-1px;left:-1px;border-width:2px 0 0 2px;}
.target-lock::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}
.scan-sweep{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.scan-sweep::after{content:"";position:absolute;top:-60%;left:-30%;width:36%;height:220%;background:linear-gradient(100deg,transparent,rgba(0,255,106,0.2),transparent);animation:sweep 2.4s linear infinite;}
@keyframes sweep{from{transform:translateX(-40%);}to{transform:translateX(420%);}}

.node-detail{border-top:1px dashed var(--line);margin-top:10px;padding-top:12px;}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
.tag{font-size:10px;padding:3px 8px;border-radius:10px;border:1px solid var(--line);color:var(--dim);letter-spacing:.5px;text-transform:uppercase;}
.tag.on{color:var(--green);border-color:var(--green-dim);background:rgba(0,255,106,.07);}

.terminal{background:#020a06;border:1px solid var(--line);border-radius:4px;padding:12px 14px;height:240px;overflow-y:auto;font-size:12px;line-height:1.65;}
.terminal .line{opacity:0;animation:typeIn .3s forwards;}
@keyframes typeIn{from{opacity:0;transform:translateX(-4px);}to{opacity:1;transform:translateX(0);}}
.t-sys{color:var(--dim);} .t-ok{color:var(--green);} .t-warn{color:var(--amber);} .t-bad{color:var(--red-role);} .t-info{color:#7fe0c8;} .t-cmd{color:#fff;} .t-data{color:#8bffce;}
.terminal::-webkit-scrollbar{width:8px;} .terminal::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

.cmdline{display:flex;align-items:center;gap:8px;margin-top:10px;border:1px solid var(--green-dim);border-radius:3px;padding:10px 12px;background:#020a06;}
.cmdline span{color:var(--green);animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:.2;}}
.cmdline input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:inherit;font-size:14px;letter-spacing:.5px;}
.hint{font-size:11px;color:var(--dim);margin-top:8px;}
.hint b{color:var(--amber);}

.xpbar{height:8px;border:1px solid var(--line);border-radius:2px;background:#020a05;overflow:hidden;margin-top:4px;}
.xpbar-fill{height:100%;background:linear-gradient(90deg,var(--green-dim),var(--green));transition:width .6s ease;}

.center-screen{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:fadeIn .5s ease;}
.big-status{font-size:26px;letter-spacing:4px;margin-bottom:6px;}
.big-status.fail{color:var(--red-role);text-shadow:0 0 16px rgba(255,59,92,.6);animation:flicker 1.4s infinite;}
.big-status.win{color:var(--green);text-shadow:0 0 16px rgba(0,255,106,.55);}
@keyframes flicker{0%,19%,21%,23%,80%,100%{opacity:1;}20%,22%,24%{opacity:.4;}}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0;max-width:560px;width:100%;}
.summary-grid div{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px;}
.summary-grid .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;}
.summary-grid .v{font-size:17px;color:var(--text);margin-top:3px;}

.cutscene{max-width:560px;border:1px solid var(--green-dim);background:var(--panel2);padding:16px 18px;border-radius:4px;margin-bottom:6px;}
.cutscene p{font-size:13px;line-height:1.7;color:var(--text);font-style:italic;}
.cutscene .cs-line{opacity:0;animation:csIn .6s forwards;}
.cutscene .cs-line:nth-child(1){animation-delay:.1s;}
.cutscene .cs-line:nth-child(2){animation-delay:.5s;}
.cutscene .cs-line:nth-child(3){animation-delay:.9s;}
@keyframes csIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.ladder{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 22px;}
.rank-step{font-size:10px;padding:5px 9px;border-radius:3px;border:1px solid var(--line);color:var(--dim);letter-spacing:.5px;}
.rank-step.reached{color:var(--green);border-color:var(--green-dim);background:rgba(0,255,106,.07);}
.rank-step.current{color:#001208;background:var(--green);border-color:var(--green);font-weight:bold;}

.ach-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;}
.ach-card{border:1px solid var(--line);background:var(--panel2);border-radius:4px;padding:12px;}
.ach-card.unlocked{border-color:var(--green-dim);}
.ach-card.locked{opacity:.45;}
.ach-card h4{margin:0 0 4px;font-size:12px;letter-spacing:1px;color:var(--green);}
.ach-card.locked h4{color:var(--dim);}
.ach-card p{font-size:11px;margin:0;color:var(--dim);}

.sentinel-panel{border-color:var(--red-role)!important;box-shadow:0 0 24px rgba(255,59,92,.25);}
.sentinel-panel h2{color:var(--red-role);border-left-color:var(--red-role);}

.role-tag-white{color:var(--white-role);}
.role-tag-red{color:var(--red-role);}

footer.note{margin-top:30px;text-align:center;font-size:10px;color:var(--dim);letter-spacing:1px;}

@media (max-width:640px){
  #app{padding:10px 10px 50px;}
  .brand-text h1{font-size:16px;letter-spacing:2px;}
  .brand svg{width:36px;height:36px;}
  .hud{gap:8px;}
  .hud-right{gap:8px;width:100%;justify-content:space-between;}
  .stat{text-align:left;}
  .panel{padding:12px;}
  .panel h2{font-size:12px;}
  .role-card{min-width:100%;}
  .mapnode{width:110px;padding:10px 6px;}
  .mapnode .icon{font-size:22px;}
  .mapnode .mname{font-size:10px;min-height:24px;}
  .node-chip{min-width:90px;font-size:10px;padding:8px 4px;}
  .node-chip .n-name{font-size:10px;}
  .terminal{height:200px;font-size:11px;}
  .summary-grid{grid-template-columns:repeat(2,1fr);}
  .big-status{font-size:19px;letter-spacing:2px;}
  .cmdline input{font-size:16px;}
}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div id="crt"></div>
<div id="vignette"></div>
<div id="toastbox"></div>
<div id="app"></div>

<script>
/* =====================================================================
   OVERRIDE // BREACH PROTOCOL
   A fictional, terminal-driven network-intrusion campaign. All targets,
   organizations, the "LATTICE" AI grid, intel, vulnerabilities and
   commands are simulated for gameplay only - no real exploit code,
   working malware, or genuine intrusion techniques are represented.
   Tool names referenced by in-game commands (nmap, hydra, medusa, etc.)
   are flavor labels only; no real usage instructions are given.
===================================================================== */

/* ---------------- MATRIX RAIN BACKGROUND ---------------- */
(function initRain(){
  const canvas = document.getElementById("rain");
  const ctx = canvas.getContext("2d");
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize();
  window.addEventListener("resize", resize);
  const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ$#%&+-/*".split("");
  let cols = Math.floor(canvas.width/16);
  let drops = new Array(cols).fill(0).map(()=>Math.random()*-40);
  window.addEventListener("resize", ()=>{ cols=Math.floor(canvas.width/16); drops=new Array(cols).fill(0).map(()=>Math.random()*-40); });
  function draw(){
    ctx.fillStyle = "rgba(0,0,0,0.10)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#00ff6a";
    ctx.font = "14px monospace";
    for(let i=0;i<drops.length;i++){
      const t = chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(t, i*16, drops[i]*16);
      if(drops[i]*16 > canvas.height && Math.random() > 0.975) drops[i]=0;
      drops[i]++;
    }
  }
  setInterval(draw, 60);
})();

function rand(min,max){ return Math.random()*(max-min)+min; }
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function pick(arr){ return arr[Math.floor(rand(0,arr.length))]; }
function shuffled(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand(0,i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function currentRank(xp){ let r=RANKS[0]; for(const s of RANKS){ if(xp>=s.min) r=s; } return r; }
function rankIndex(xp){ return RANKS.findIndex(r=>r.name===currentRank(xp).name); }
function nextRankInfo(xp){ const i=rankIndex(xp); return i===RANKS.length-1?null:RANKS[i+1]; }
function roleMods(){ return ROLE_STATS[state.role]; }
function maxStealthForRank(){
  const idx = rankIndex(state.xp);
  return STEALTH_BASE[state.role] + STEALTH_PER_RANK[state.role]*idx;
}

function log(text,type){
  state.logs.push({text, type:type||"t-sys"});
  if(state.logs.length>250) state.logs.shift();
}

function toast(title,text,deny){
  const box = document.getElementById("toastbox");
  const d = document.createElement("div");
  d.className="toast"+(deny?" deny":"");
  d.innerHTML = `<b>${title}</b>${text}`;
  box.appendChild(d);
  setTimeout(()=>{ d.remove(); }, 4200);
}

function unlock(id){
  if(state.achievements.has(id)) return;
  state.achievements.add(id);
  const a = ACHIEVEMENTS.find(x=>x.id===id);
  toast("Achievement Unlocked", a.name);
  log(`ACHIEVEMENT UNLOCKED: ${a.name}`, "t-warn");
}

    discovered:false, vulnKnown:false, penetrated:false, compromised:false,

/* ---------------- CORE MECHANICS ---------------- */
function addDetection(amount){
  const m = roleMods();
  const applied = amount*m.detMult;
  state.detection = clamp(state.detection+applied,0,100);
  state.missionMaxDetection = Math.max(state.missionMaxDetection, state.detection);
  maybePassiveSweep();
  checkGameOver();
}

function maybePassiveSweep(){
  state.totalActions++;
  const freq = state.bonusRound ? 1 : 3;
  if(state.totalActions % freq === 0){
    const bump = state.bonusRound ? rand(3,7) : rand(1,3);
    state.detection = clamp(state.detection+bump,0,100);
    state.missionMaxDetection = Math.max(state.missionMaxDetection, state.detection);
    log(state.bonusRound
      ? `SENTINEL actively probes your connection (+${bump.toFixed(1)}%)`
      : `IDS passive sweep detects anomalous traffic pattern (+${bump.toFixed(1)}%)`, "t-warn");
  }
}

function checkGameOver(){
  if(state.detection >= DETECTION_THRESHOLD){
    state.screen = "gameover";
  }
}

function node(){ return state.nodes[state.activeNode]; }

function trackSentinelPattern(actionType){
  if(!state.bonusRound) return;
  state.sentinelLastActions.push(actionType);
  if(state.sentinelLastActions.length>3) state.sentinelLastActions.shift();
  const last = state.sentinelLastActions;
  if(last.length>=2 && last[last.length-1]===last[last.length-2]){
    state.sentinelAdaptBonus = Math.min(state.sentinelAdaptBonus+2, 6);
    log(`SENTINEL anticipated your ${actionType.toUpperCase()} pattern. Adapting defenses.`, "t-bad");
  } else {
    state.sentinelAdaptBonus = Math.max(state.sentinelAdaptBonus-1, 0);
  }
}

function effectiveDefense(n){
  return n.defense + (state.bonusRound ? state.sentinelAdaptBonus : 0);
}

/* ---- SCAN family: scan / nmap ---- */
function doScan(deep){
  const n = node();
  if(n.discovered){ log("Node already scanned.", "t-sys"); render(); return; }
  n.discovered = true;
  trackSentinelPattern("scan");
  const def = effectiveDefense(n);
  log(`Running ${deep? "an nmap-style deep":"a"} port + service scan on ${n.name}...`, "t-sys");

  const numPorts = Math.round(rand(deep?4:2, deep?7:5));
  const ports = shuffled(PORT_POOL).slice(0,numPorts);
  ports.forEach(p=>log(`  open door: ${p}`, "t-data"));

  if(deep || rand(0,100) < clamp(45-def*2,10,60)){
    const doc = pick(DOC_POOL);
    log(`  public document indexed: ${doc}`, "t-data");
  }

  const alarmChance = clamp((deep?38:30)+def*4,15,90);
  if(rand(0,100) < alarmChance){
    const d = (deep?2.2:1.5)+def*0.35+rand(0,2);
    log(`Scan brushed against a monitored port. Minor alarm raised.`, "t-warn");
    addDetection(d);
  } else {
    log(`Scan completed silently. No alarms triggered.`, "t-ok");
  }
  render();
}

/* ---- RECON family: recon / filedirectory ---- */
function doRecon(){
  const n = node();
  if(!n.discovered){ log("Scan the node before running reconnaissance.", "t-bad"); render(); return; }
  if(n.vulnKnown){ log("Reconnaissance already completed on this node.", "t-sys"); render(); return; }
  n.vulnKnown = true;
  trackSentinelPattern("recon");
  const def = effectiveDefense(n);

  const fraction = clamp(1 - def/14, 0.25, 1);
  const revealCount = Math.max(1, Math.round(INTEL_FIELDS.length*fraction));
  const fields = shuffled(INTEL_FIELDS).slice(0,revealCount);

  log(`Cross-referencing ${n.name} fingerprint against known intel sources...`, "t-sys");
  if(fields.includes("IP Address")) log(`  IP Address: 10.${Math.floor(rand(0,255))}.${Math.floor(rand(0,255))}.${Math.floor(rand(1,254))}`, "t-data");
  if(fields.includes("Username")) log(`  Username: ${pick(["j.morales","a.chen","r.okafor","s.ivanova","d.reyes"])}`, "t-data");
  if(fields.includes("Internal Subnet")) log(`  Internal Subnet: 172.${Math.floor(rand(16,31))}.${Math.floor(rand(0,255))}.0/24`, "t-data");
  if(fields.includes("Linked Document")) log(`  Linked Document: ${pick(DOC_POOL)}`, "t-data");
  if(fields.includes("Password Hash Fragment")) log(`  Password Hash Fragment: ${Math.random().toString(16).slice(2,10)}…`, "t-data");
  if(fields.includes("Active Session Token")) log(`  Active Session Token: ${Math.random().toString(16).slice(2,12)}`, "t-data");

  if(revealCount < INTEL_FIELDS.length){
    log(`High security rating on this node concealed ${INTEL_FIELDS.length-revealCount} additional field(s).`, "t-warn");
  } else {
    log(`Low security rating exposed the full intel set.`, "t-warn");
  }

  const d = rand(3,6) + def*0.25;
  addDetection(d);
  render();
}

function doFileDirectory(){
  const n = node();
  if(!n.discovered){ log("Scan the node before searching directories.", "t-bad"); render(); return; }
  trackSentinelPattern("recon");
  const def = effectiveDefense(n);
  log(`Brute-forcing hidden paths on ${n.name}...`, "t-sys");
  const found = shuffled(DIR_POOL).slice(0, Math.round(rand(2,5)));
  found.forEach(p=>log(`  discovered path: ${p}`, "t-data"));
  const d = rand(2,4) + def*0.2;
  addDetection(d);
  log(`Directory sweep complete.`, "t-ok");
  render();
}

/* ---- DDOS: disrupt, temporarily weakens node, heavy detection ---- */
function doDDOS(){
  const n = node();
  if(!n.discovered){ log("Scan the node before launching a disruption attack.", "t-bad"); render(); return; }
  if(n._disrupted){ log("Target is already reeling from a recent flood attack.", "t-sys"); render(); return; }
  trackSentinelPattern("ddos");
  n._disrupted = true;
  n._disruptBonus = 3;
  log(`Launching a distributed denial-of-service flood against ${n.name}...`, "t-sys");
  log(`Target service degraded. Its defenses are temporarily weaker.`, "t-ok");
  const def = effectiveDefense(n);
  addDetection(rand(18,28) + def*0.4);
  state.ddosCount++;
  if(state.ddosCount>=3) unlock("flood_tactics");
  render();
}

/* ---- KALI SUITE: combined scan + recon in one pass ---- */
function doKaliSuite(){
  const n = node();
  trackSentinelPattern("kalisuite");
  log(`Deploying full pentest toolkit against ${n.name}...`, "t-sys");
  if(!n.discovered){
    n.discovered = true;
    const ports = shuffled(PORT_POOL).slice(0,Math.round(rand(3,6)));
    ports.forEach(p=>log(`  open door: ${p}`, "t-data"));
  }
  if(!n.vulnKnown){
    n.vulnKnown = true;
    const def = effectiveDefense(n);
    const fraction = clamp(1 - def/14, 0.3, 1);
    const revealCount = Math.max(1, Math.round(INTEL_FIELDS.length*fraction));
    shuffled(INTEL_FIELDS).slice(0,revealCount).forEach(f=>log(`  intel: ${f} acquired`, "t-data"));
  }
  const def = effectiveDefense(n);
  const d = rand(6,10) + def*0.35;
  addDetection(d);
  state.kalisuiteCount++;
  if(state.kalisuiteCount>=5) unlock("toolkit_master");
  log(`Toolkit pass complete.`, "t-ok");
  render();
}

function doStealth(){
  if(state.stealthUses<=0){ log("No stealth charges remaining.", "t-bad"); render(); return; }
  state.stealthUses--;
  const m = roleMods();
  const reduction = (rand(8,14)) * m.stealthEffectMult;
  state.detection = clamp(state.detection-reduction,0,100);
  trackSentinelPattern("stealth");
  state.missionStealthCount++;
  if(state.missionStealthCount>=5) unlock("silent_partner");
  log(`Rerouting traffic, wiping session logs, going dark...`, "t-info");
  log(`Trace level reduced by ${reduction.toFixed(1)}%. (${state.stealthUses} charges left)`, "t-ok");
  render();
}

/* ---- PENETRATE ---- */
function runPenetrate(cmdKey){
  const n = node();
  if(!n.discovered){ log("Scan the node before attempting penetration.", "t-bad"); render(); return; }
  if(n.penetrated){ log("Foothold already established on this node.", "t-sys"); render(); return; }
  const tech = PENETRATE_COMMANDS[cmdKey] || {label:"Manual Exploit Attempt", det:[9,15], succAdj:0};
  if(cmdKey && PENETRATE_COMMANDS[cmdKey]){
    state.penetrateTechniquesUsed.add(cmdKey);
    if(state.penetrateTechniquesUsed.size >= Object.keys(PENETRATE_COMMANDS).length) unlock("arsenal");
  }
  const m = roleMods();
  let def = effectiveDefense(n);
  if(n._disrupted){ def = Math.max(1, def - n._disruptBonus); n._disrupted=false; }
  let chance = 58 + (n.vulnKnown?25:0) - def*2.2 + m.successAdj + tech.succAdj;
  chance = clamp(chance,10,96);
  const roll = rand(0,100);
  trackSentinelPattern("penetrate");
  log(`Executing ${tech.label} against ${n.name} (est. success ${chance.toFixed(0)}%)...`, "t-sys");
  if(roll<=chance){
    n.penetrated = true;
    log(`Breach successful. Foothold established inside ${n.name}.`, "t-ok");
    addDetection(rand(tech.det[0],tech.det[1]) + def*0.35);
  } else {
    state.missionFailCount++;
    log(`${tech.label} rejected. Connection reset by target.`, "t-bad");
    addDetection(rand(tech.det[0]+5,tech.det[1]+6) + def*0.45);
  }
  render();
}

/* ---- HACK TERMINAL ---- */
function runHack(cmdKey){
  const n = node();
  if(!n.penetrated){ log("Establish a foothold with a penetrate command first.", "t-bad"); render(); return; }
  if(n.compromised){ log("Node already fully compromised.", "t-sys"); render(); return; }
  const tech = HACK_COMMANDS[cmdKey] || {label:"Manual Terminal Takeover", det:[16,24], succAdj:0};
  const m = roleMods();
  const def = effectiveDefense(n);
  let chance = 66 + m.successAdj + tech.succAdj - def*1.6;
  chance = clamp(chance,12,97);
  const roll = rand(0,100);
  trackSentinelPattern("hack");
  log(`Deploying ${tech.label} against ${n.name}...`, "t-sys");
  if(roll<=chance){
    n.compromised = true;
    const xpGain = Math.round(n.defense*16*m.xpMult);
    state.xp += xpGain;
    log(`TERMINAL HACKED. ${n.name} fully compromised via ${tech.label}. +${xpGain} XP`, "t-ok");
    if(!state.achievements.has("first_breach")) unlock("first_breach");
    checkRankAchievements();
    addDetection(rand(tech.det[0],tech.det[1]) + def*0.4);
    advanceNode();
  } else {
    state.missionFailCount++;
    log(`${tech.label} failed. Security daemon restarted the shell.`, "t-bad");
    addDetection(rand(tech.det[0]+6,tech.det[1]+8) + def*0.5);
  }
  render();
}

function checkRankAchievements(){
  if(currentRank(state.xp).name==="MasterHacker") unlock("masterhacker");
}

function advanceNode(){
  if(state.activeNode < state.nodes.length-1){
    state.activeNode++;
    log(`Pivoting deeper into the network...`, "t-info");
  } else {
    if(state.bonusRound){
      unlock("checkmate");
      state.screen = "sentinelwin";
    } else {
      const idx = state.activeCampaignIdx;
      state.missionStats[idx] = {
        xp: Math.round(state.xp - state.missionXPStart),
        commands: state.missionCmdCount,
        fails: state.missionFailCount,
        peakDetection: Math.round(state.missionMaxDetection),
      };
      if(state.missionMaxDetection<=25) unlock("ghost_protocol");
      if(state.missionMaxDetection>=65) unlock("iron_nerves");
      if(state.missionFailCount===0) unlock("flawless");
      state.campaignProgress = Math.max(state.campaignProgress, idx+1);
      if(state.campaignProgress>=4) unlock("foothold");
      if(state.campaignProgress>=10) unlock("halfway");
      if(state.campaignProgress>=20) unlock("network_cleared");
      state.screen = "missioncomplete";
    }
  }
}

/* ---------------- TERMINAL COMMAND PARSER ---------------- */
function helpText(){
  log(`General: scan, nmap, recon, filedirectory, kalisuite, stealth, status, nodes, clear, help`, "t-info");
  log(`Disrupt: ddos (weakens target's defense briefly, high detection)`, "t-info");
  log(`Penetrate techniques (need scan first): ${Object.keys(PENETRATE_COMMANDS).join(", ")}`, "t-info");
  log(`Hack techniques (need a foothold): ${Object.keys(HACK_COMMANDS).join(", ")}`, "t-info");
}

function handleCommand(raw){
  const cmd = raw.trim().toLowerCase();
  if(cmd==="") return;
  log(`root@override:~$ ${raw}`, "t-cmd");
  state.termCmdCount++;
  state.missionCmdCount++;
  if(state.termCmdCount>=10) unlock("terminal_adept");

  if(cmd==="override protocol"){
    unlock("ghost_machine");
    log("... ACCESS GRANTED. Something in the LATTICE just noticed you.", "t-warn");
    render(); return;
  }

  if(cmd==="help"){ helpText(); render(); return; }
  if(cmd==="scan"){ doScan(false); return; }
  if(cmd==="nmap"){ doScan(true); return; }
  if(cmd==="recon" || cmd==="reconnaissance"){ doRecon(); return; }
  if(cmd==="filedirectory" || cmd==="dirsearch" || cmd==="directory"){ doFileDirectory(); return; }
  if(cmd==="kalisuite" || cmd==="kali" || cmd==="kali-linux" || cmd==="kalilinux"){ doKaliSuite(); return; }
  if(cmd==="ddos"){ doDDOS(); return; }
  if(cmd==="stealth"){ doStealth(); return; }
  if(cmd==="penetrate"){ runPenetrate(null); return; }
  if(PENETRATE_COMMANDS[cmd]){ runPenetrate(cmd); return; }
  if(cmd==="hack" || cmd==="hack terminal"){ runHack(null); return; }
  if(HACK_COMMANDS[cmd]){ runHack(cmd); return; }

  if(cmd==="status"){
    log(`Trace level: ${state.detection.toFixed(1)}% / ${DETECTION_THRESHOLD}% · XP: ${Math.round(state.xp)} · Rank: ${currentRank(state.xp).name} · Stealth charges: ${state.stealthUses}/${state.maxStealthUses}`, "t-info");
    render(); return;
  }
  if(cmd==="nodes"){
    state.nodes.forEach((n,i)=>{
      const st = n.compromised?"COMPROMISED":(i===state.activeNode?"ACTIVE":"LOCKED");
      log(`[${i+1}] ${n.name} — ${st}`, "t-info");
    });
    render(); return;
  }
  if(cmd==="clear"){ state.logs = []; render(); return; }

  log(`Unknown command: '${raw}'. Type 'help' for a list of available commands.`, "t-bad");
  render();
}

  }
  return `<span class="icon" style="font-size:${size}px;line-height:1;display:inline-block;vertical-align:middle;">${m.icon}</span>`;
}

/* ---- CAMPAIGN MAP ---- */
function renderMap(){
  let html = `<div class="panel"><h2>Campaign Map</h2><p class="muted">Select a location. Each network must be cleared before the next unlocks.</p></div>`;
  for(let t=0;t<5;t++){
    const missions = CAMPAIGN.map((m,i)=>({...m,idx:i})).filter(m=>m.tier===t);
    html += `<div class="tier-block"><div class="tier-head"><b>${TIER_LABELS[t]}</b></div><div class="maprow">`;
    html += missions.map(m=>{
      let cls="locked";
      if(m.idx < state.campaignProgress) cls="done";
      else if(m.idx === state.campaignProgress) cls="current";
      return `<div class="mapnode ${cls}" onclick="app.clickNode(${m.idx})">
        ${iconHTML(m,30)}
        <span class="mname">${m.name}</span>
        <span class="mthreat">${m.threat}</span>
      </div>`;
    }).join("");
    html += `</div></div>`;
  }
  const bossCls = state.campaignProgress>=20 ? (state.achievements.has("checkmate")?"done":"current") : "locked";
  html += `<div class="tier-block"><div class="tier-head"><b>⚠ SECRET BONUS ROUND</b></div><div class="maprow">
    <div class="mapnode boss ${bossCls}" onclick="app.clickBoss()">
      <span class="icon">👾</span>
      <span class="mname">SENTINEL-9</span>
      <span class="mthreat">Adaptive AI</span>
    </div>
  </div></div>`;
  return html;
}

  const s = state.missionStats[idx] || {xp:0,commands:0,fails:0,peakDetection:0};

  <div class="panel">
    <h2>${iconHTML(tpl,20)} ${tpl.name} — Cleared</h2>
    <p class="muted">${tpl.brief}</p>
    <div class="stats-grid">
      <div><div class="k">XP Earned</div><div class="v">${s.xp}</div></div>
      <div><div class="k">Commands Used</div><div class="v">${s.commands}</div></div>
      <div><div class="k">Failed Attempts</div><div class="v">${s.fails}</div></div>

    <button class="btn" onclick="app.goMap()">Back to Map</button>

}

function renderNodeMap(){
  return `<div class="nodemap">${state.nodes.map((n,i)=>{
    let cls="locked", status="Locked";
    if(n.compromised){ cls="done"; status="Compromised"; }
    else if(i===state.activeNode){ cls="active target-lock"; status="In Progress"; }
    const arrow = i<state.nodes.length-1 ? `<div class="node-arrow">›</div>` : "";
    const sweep = i===state.activeNode ? `<div class="scan-sweep"></div>` : "";
    return `<div class="node-chip ${cls}">${sweep}<span class="n-name">${n.name}</span><span class="n-status">${status}</span></div>${arrow}`;
  }).join("")}</div>`;

function renderNodeDetail(){
  const n = node();
  const def = effectiveDefense(n);
  return `
  <div class="node-detail">
    <h2 style="border:none;padding:0;margin-bottom:8px;">TARGET NODE: ${n.name} <span class="muted" style="font-size:11px;">(security rating ${def}/20${state.bonusRound && state.sentinelAdaptBonus>0 ? ' — adapted +'+state.sentinelAdaptBonus : ''})</span></h2>
    <div class="tags">
      <span class="tag ${n.discovered?'on':''}">${n.discovered?'✓ Scanned':'Not Scanned'}</span>
      <span class="tag ${n.vulnKnown?'on':''}">${n.vulnKnown?'✓ Recon Done':'No Recon'}</span>
      <span class="tag ${n.penetrated?'on':''}">${n.penetrated?'✓ Foothold':'Not Breached'}</span>

    </div>
    <div class="hint">Type <b>help</b> for the full command list. Scan/nmap → recon/filedirectory → a Penetrate technique → a Hack technique, in order. Stealth and ddos can be used any time.</div>

}

function renderMission(){
  const tpl = state.currentTpl;

function renderMissionComplete(){

function renderGameOver(){
  const rank = currentRank(state.xp);

  <div class="center-screen">
    <div class="big-status fail">CONNECTION TRACED</div>
    <p class="muted">Your trace level crossed ${DETECTION_THRESHOLD}%. Automated countermeasures locked the session and flagged your relay chain. The operation is over.</p>

      <div><div class="k">XP Earned</div><div class="v">${Math.round(state.xp)}</div></div>
      <div><div class="k">Final Rank</div><div class="v">${rank.name}</div></div>
      <div><div class="k">Locations Cleared</div><div class="v">${state.campaignProgress}</div></div>
      <div><div class="k">Role</div><div class="v">${state.role==="white"?"White Hat":"Red Hat"}</div></div>

function renderSentinelWin(){
  const rank = currentRank(state.xp);
  return `
  <div class="center-screen">
    <div class="big-status win">SENTINEL-9 NEUTRALIZED</div>
    <div class="cutscene"><p class="cs-line">The adaptive AI's core has been fully compromised. Its learning model — and whatever it was really watching for — is now yours.</p></div>
    <div class="summary-grid">
      <div><div class="k">Total XP</div><div class="v">${Math.round(state.xp)}</div></div>
      <div><div class="k">Final Rank</div><div class="v">${rank.name}</div></div>
      <div><div class="k">Achievements</div><div class="v">${state.achievements.size}/${ACHIEVEMENTS.length}</div></div>
    </div>
    ${renderLadder()}
    <button class="btn primary" onclick="app.goMap()">Return to Map</button>
    <button class="btn ghost" onclick="app.goMainMenu()">Main Menu</button>
  </div>`;
}

function renderLadder(){
  const rank = currentRank(state.xp);
  return `<div class="ladder">${RANKS.map(r=>{
    const cls = r.name===rank.name ? "current" : (state.xp>=r.min?"reached":"");
    return `<div class="rank-step ${cls}">${r.name}</div>`;
  }).join("")}</div>`;
}

function renderAchievements(){
  return `
  <div class="panel">
    <h2>Achievements (${state.achievements.size}/${ACHIEVEMENTS.length})</h2>
    <div class="ach-grid">
      ${ACHIEVEMENTS.map(a=>{
        const got = state.achievements.has(a.id);
        const title = a.hidden && !got ? "??? Secret Achievement" : a.name;
        const desc = a.hidden && !got ? "Keep exploring the Access Terminal..." : a.desc;
        return `<div class="ach-card ${got?'unlocked':'locked'}"><h4>${got?'✓ ':''}${title}</h4><p>${desc}</p></div>`;
      }).join("")}
    </div>
    <button class="btn" onclick="app.closeAchievements()" style="margin-top:14px;">Back</button>
  </div>`;
}

function render(){
  const appEl = document.getElementById("app");
  let html = "";
  if(state.screen!=="boot") html += renderHUD();
  switch(state.screen){
    case "boot": html += renderBoot(); break;
    case "role": html += renderRoleSelect(); break;
    case "map": html += renderMap(); break;
    case "report": html += renderLocationReport(state.lastReportIdx); break;
    case "mission": html += renderMission(); break;
    case "missioncomplete": html += renderMissionComplete(); break;
    case "gameover": html += renderGameOver(); break;
    case "sentinelwin": html += renderSentinelWin(); break;
    case "achievements": html += renderAchievements(); break;
  }
  html += `<footer class="note">SIMULATED ENVIRONMENT — no real network intrusion techniques are represented. For entertainment &amp; training purposes only.</footer>`;
  appEl.innerHTML = html;
  scrollTerm();
  const inp = document.getElementById("cmdinput");
  if(inp) inp.focus();
}

/* ---------------- APP CONTROLLER ---------------- */
let prevScreen = "map";
window.app = {
  begin(){ state.screen = state.role ? "map" : "role"; render(); },
  goMainMenu(){ state.confirmingReset=false; state.screen="boot"; render(); },
  askReset(){ state.confirmingReset = true; render(); },
  cancelReset(){ state.confirmingReset = false; render(); },
  confirmReset(){
    state.role=null; state.xp=0; state.detection=0; state.campaignProgress=0;
    state.missionStats={}; state.logs=[]; state.totalActions=0;
    state.bonusRound=false; state.achievements=new Set(); state.termCmdCount=0;
    state.kalisuiteCount=0; state.ddosCount=0; state.penetrateTechniquesUsed=new Set();
    state.confirmingReset=false;
    state.screen="boot";
    render();
  },
  chooseRole(role){
    state.role = role;
    state.xp = 0;
    state.campaignProgress = 0;
    state.missionStats = {};
    state.maxStealthUses = maxStealthForRank();
    state.stealthUses = state.maxStealthUses;
    state.screen = "map";
    render();
  },
  clickNode(idx){
    if(idx < state.campaignProgress){
      state.lastReportIdx = idx;
      state.screen = "report";
      render();
    } else if(idx === state.campaignProgress){
      startMission(idx);
    } else {
      toast("Access Denied", "You cannot proceed to this location yet. Complete the previous location first.", true);
    }
  },
  clickBoss(){
    if(state.campaignProgress>=20) startBonusRound();
    else toast("Access Denied", "SENTINEL-9 stays hidden until the full campaign is cleared.", true);
  },
  goMap(){ state.screen="map"; render(); },
  cmdKey(ev){
    if(ev.key==="Enter"){
      const val = ev.target.value;
      ev.target.value="";
      handleCommand(val);
    }
  },
  abortMission(){
    log("Operator initiated manual disconnect. Session terminated cleanly.", "t-info");
    state.screen = "map";
    render();
  },
  openAchievements(){ prevScreen = state.screen; state.screen="achievements"; render(); },
  closeAchievements(){ state.screen = prevScreen; render(); }
};

render();
